
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AI Hub & Dataset Collector</title>

    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-950 text-gray-100 flex flex-col h-screen">

    <!-- HEADER -->

    <header class="bg-gray-900 border-b border-gray-800 p-4 flex flex-wrap justify-between items-center gap-3">

        <div class="flex items-center gap-3 flex-wrap">

            <h1 class="text-xl font-bold">
                🤖 AI Hub & Dataset Collector
            </h1>

            <span id="status"
                class="text-xs bg-green-900/30 text-green-400 px-3 py-2 rounded-full">
                ● Ready
            </span>

            <span id="usageCounter"
                class="text-xs bg-red-900/30 text-red-400 px-3 py-2 rounded-full">
                Usage: 0/50 today
            </span>

        </div>


        <div class="flex items-center gap-3 flex-wrap">

            <!-- WEB SEARCH -->

            <label class="flex items-center gap-2 text-sm cursor-pointer bg-gray-800 px-3 py-2 rounded-lg border border-gray-700">

                <input
                    type="checkbox"
                    id="searchToggle"
                    checked
                    class="accent-blue-500">

                Web Search

            </label>


            <!-- MODEL SELECTOR -->

            <select
                id="modelSelect"
                class="bg-gray-800 border border-gray-700 rounded-lg px-3 py-2 text-sm min-w-64 focus:outline-none focus:border-blue-500">


                <optgroup label="OpenRouter 100% Free Tier">

                    <option value="or/openrouter/free">
                        OpenRouter: Auto Free Router
                    </option>

                    <option value="or/nvidia/nemotron-3-ultra-550b-a55b:free">
                        OpenRouter: Nemotron 3 Ultra 550B (Free)
                    </option>

                    <option value="or/nvidia/nemotron-3.5-super-vl:free">
                        OpenRouter: Nemotron 3.5 Super VL (Free)
                    </option>

                    <option value="or/nvidia/nemotron-3.5-lightning:free">
                        OpenRouter: Nemotron 3.5 Lightning (Free)
                    </option>

                </optgroup>


                <optgroup label="Groq Active Models (Fast)">

                    <option value="groq/openai/gpt-oss-20b">
                        Groq: GPT-OSS 20B
                    </option>

                    <option value="groq/openai/gpt-oss-120b">
                        Groq: GPT-OSS 120B (Reasoning)
                    </option>

                    <option value="groq/qwen/qwen3.8-27b">
                        Groq: Qwen 3.8 27B
                    </option>

                </optgroup>


                <optgroup label="Google Gemini">

                    <option value="gemini/gemini-3.8-flash">
                        Gemini 3.8 Flash
                    </option>

                    <option value="gemini/gemini-3.5-flash-lite" selected>
                        Gemini 3.5 Flash-Lite
                    </option>

                    <option value="gemini/gemini-3.5-flash">
                        Gemini 3.5 Flash
                    </option>

                </optgroup>


                <optgroup label="Custom Local Training">

                    <option value="custom-gemma">
                        My Fine-Tuned Gemma 2B (Colab)
                    </option>

                </optgroup>

            </select>

        </div>

    </header>



    <!-- CHAT -->

    <main
        id="chatContainer"
        class="flex-1 overflow-y-auto p-6 space-y-5 w-full">

        <div class="flex items-start gap-3">

            <div class="bg-blue-600 text-white rounded-full h-9 w-9 flex items-center justify-center font-bold text-xs shrink-0">
                AI
            </div>

            <div class="bg-gray-800 border border-gray-700 p-4 rounded-2xl max-w-[85%] text-sm leading-relaxed whitespace-pre-wrap">

Welcome to AI Hub!

Your AI assistant is ready.

Select a model, enable Web Search if desired, and start chatting.

Your API requests are routed through Google Apps Script.

            </div>

        </div>

    </main>



    <!-- INPUT -->

    <footer class="bg-gray-900 border-t border-gray-800 p-4">

        <div class="flex gap-3 w-full">

            <textarea
                id="userInput"
                rows="1"
                placeholder="Type your message here..."
                class="flex-1 bg-gray-950 border border-gray-700 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-blue-500 resize-none"></textarea>

            <button
                id="sendBtn"
                class="bg-blue-600 hover:bg-blue-500 disabled:bg-gray-600 text-white font-medium px-7 py-3 rounded-xl text-sm transition-colors shrink-0">

                Send

            </button>

        </div>

    </footer>



<script>

// ==================================================
// 1. CONFIGURATION
// ==================================================

// YOUR EXISTING GOOGLE APPS SCRIPT URL.

const APPS_SCRIPT_URL =
"https://script.google.com/macros/s/AKfycbxDaZYcylrw4dps4kfQsosJSThOzRWOiN_07g57b6NddUofisi7Ul19whVwXu6wuM66/exec";

const DAILY_LIMIT = 50;


// ==================================================
// 2. ELEMENTS
// ==================================================

const chatContainer =
document.getElementById("chatContainer");

const userInput =
document.getElementById("userInput");

const sendBtn =
document.getElementById("sendBtn");

const modelSelect =
document.getElementById("modelSelect");

const searchToggle =
document.getElementById("searchToggle");

const usageCounter =
document.getElementById("usageCounter");

const status =
document.getElementById("status");


// ==================================================
// 3. CONVERSATION MEMORY
// ==================================================

let messages = [];

let isSending = false;


// ==================================================
// 4. USAGE COUNTER
// ==================================================

function getToday() {

    const date = new Date();

    return [
        date.getFullYear(),
        String(date.getMonth() + 1).padStart(2, "0"),
        String(date.getDate()).padStart(2, "0")
    ].join("-");

}


function getUsage() {

    try {

        const saved = JSON.parse(
            localStorage.getItem("ai_chat_usage") || "{}"
        );

        if (saved.date !== getToday()) {

            return {
                date: getToday(),
                count: 0
            };

        }

        return saved;

    } catch {

        return {
            date: getToday(),
            count: 0
        };

    }

}


function updateUsage() {

    const usage = getUsage();

    usageCounter.innerText =
        `Usage: ${usage.count}/${DAILY_LIMIT} today`;

}


function recordUsage() {

    const usage = getUsage();

    usage.count++;

    localStorage.setItem(
        "ai_chat_usage",
        JSON.stringify(usage)
    );

    updateUsage();

}


// ==================================================
// 5. STATUS DISPLAY
// ==================================================

function setStatus(message, color) {

    status.innerText = "● " + message;

    status.className =
        `text-xs px-3 py-2 rounded-full bg-gray-800 ${color}`;

}


// ==================================================
// 6. MESSAGE DISPLAY
// ==================================================

function appendMessage(role, content) {

    const isUser = role === "user";

    const wrapper =
        document.createElement("div");

    wrapper.className =
        `flex items-start gap-3 ${isUser ? "flex-row-reverse" : ""}`;

    const avatar =
        document.createElement("div");

    avatar.className =
        `${isUser ? "bg-emerald-600" : "bg-blue-600"} text-white rounded-full h-9 w-9 flex items-center justify-center font-bold text-xs shrink-0`;

    avatar.innerText =
        isUser ? "You" : "AI";

    const bubble =
        document.createElement("div");

    bubble.className =
        `${isUser ? "bg-blue-600 text-white" : "bg-gray-800 border border-gray-700 text-gray-100"} p-4 rounded-2xl max-w-[85%] text-sm leading-relaxed whitespace-pre-wrap break-words`;

    bubble.textContent = content;

    wrapper.appendChild(avatar);

    wrapper.appendChild(bubble);

    chatContainer.appendChild(wrapper);

    chatContainer.scrollTop =
        chatContainer.scrollHeight;

    return wrapper;

}


// ==================================================
// 7. EXTRACT RESPONSE
// ==================================================

function extractReply(data) {

    if (data.error) {

        throw new Error(data.error);

    }

    if (
        data.choices &&
        data.choices[0] &&
        data.choices[0].message
    ) {

        const content =
            data.choices[0].message.content;

        if (typeof content === "string") {

            return content;

        }

        if (Array.isArray(content)) {

            return content.map(
                part => part.text || ""
            ).join("");

        }

    }

    throw new Error(
        "The server returned an unexpected response."
    );

}


// ==================================================
// 8. SEND MESSAGE
// ==================================================

async function handleSend() {

    if (isSending) return;

    const text =
        userInput.value.trim();

    if (!text) return;


    // DAILY LIMIT CHECK

    if (getUsage().count >= DAILY_LIMIT) {

        alert("Daily usage limit of 50 reached!");

        return;

    }


    isSending = true;

    sendBtn.disabled = true;

    sendBtn.innerText = "Sending...";


    // DISPLAY USER MESSAGE

    userInput.value = "";

    appendMessage("user", text);

    messages.push({

        role: "user",

        content: text

    });


    // READ SETTINGS

    const selectedModel =
        modelSelect.value;

    const useSearch =
        searchToggle.checked;


    // LOADING MESSAGE

    const loadingMessage =
        appendMessage("assistant", "Thinking...");


    try {

        setStatus(
            "Connecting to Apps Script",
            "text-yellow-400"
        );


        // REQUEST DATA

        const payload = {

            model: selectedModel,

            useSearch: useSearch,

            messages: messages,

            logToSheet: true

        };


        // POST REQUEST
        // text/plain avoids the JSON preflight request.

        const response = await fetch(
            APPS_SCRIPT_URL,
            {

                method: "POST",

                headers: {

                    "Content-Type":
                    "text/plain;charset=utf-8"

                },

                body: JSON.stringify(payload)

            }
        );


        const rawText =
            await response.text();


        let data;

        try {

            data = JSON.parse(rawText);

        } catch {

            throw new Error(
                "Apps Script returned non-JSON data. Check your deployment."
            );

        }


        if (!response.ok) {

            throw new Error(
                "HTTP error: " + response.status
            );

        }


        const reply =
            extractReply(data);


        // REMOVE THINKING MESSAGE

        loadingMessage.remove();


        // DISPLAY REPLY

        appendMessage("assistant", reply);


        // SAVE CONVERSATION

        messages.push({

            role: "assistant",

            content: reply

        });


        // COUNT SUCCESSFUL REQUEST

        recordUsage();


        // SHOW SEARCH WARNINGS

        if (data.searchWarning) {

            appendMessage(
                "assistant",
                "⚠️ " + data.searchWarning
            );

        }


        // SHOW LOGGING WARNINGS

        if (data.loggingWarning) {

            appendMessage(
                "assistant",
                "⚠️ " + data.loggingWarning
            );

        }


        setStatus(
            "Connected",
            "text-green-400"
        );


    } catch (error) {

        loadingMessage.remove();

        appendMessage(
            "assistant",
            "⚠️ Error: " + error.message
        );

        setStatus(
            "Connection Error",
            "text-red-400"
        );

        console.error(error);


    } finally {

        isSending = false;

        sendBtn.disabled = false;

        sendBtn.innerText = "Send";

        userInput.focus();

    }

}


// ==================================================
// 9. BUTTON EVENTS
// ==================================================

sendBtn.addEventListener(
    "click",
    handleSend
);


// ENTER = SEND
// SHIFT + ENTER = NEW LINE

userInput.addEventListener(
    "keydown",
    function(event) {

        if (
            event.key === "Enter" &&
            !event.shiftKey
        ) {

            event.preventDefault();

            handleSend();

        }

    }
);


// ==================================================
// 10. INITIALIZATION
// ==================================================

updateUsage();

setStatus(
    "Ready",
    "text-green-400"
);

</script>

</body>
</html>
