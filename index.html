<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My AI Training Chat</title>
  <style>
    :root {
      --bg: #0f1117;
      --panel: #181b23;
      --border: #2a2f3d;
      --text: #e6e8ef;
      --muted: #8b92a5;
      --accent: #4f8cff;
      --user-bubble: #2563eb;
      --ai-bubble: #1e222d;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background: var(--bg); color: var(--text); display: flex; flex-direction: column; height: 100vh; overflow: hidden; }

    /* Header */
    header {
      padding: 14px 24px; background: var(--panel); border-bottom: 1px solid var(--border);
      display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap;
    }
    .header-left { display: flex; align-items: center; gap: 12px; }
    header h1 { font-size: 1.05rem; font-weight: 600; }
    .status-badge { font-size: 0.75rem; color: #4ade80; background: rgba(74, 222, 128, 0.1); padding: 4px 10px; border-radius: 20px; }

    /* Model Selector in Header */
    select {
      padding: 8px 12px; border-radius: 8px; border: 1px solid var(--border);
      background: var(--bg); color: var(--text); font-size: 0.85rem; cursor: pointer;
    }
    select:focus { outline: none; border-color: var(--accent); }

    /* Chat Area */
    .chat-box { flex: 1; padding: 24px; overflow-y: auto; display: flex; flex-direction: column; gap: 16px; }
    .msg { max-width: 75%; padding: 12px 16px; border-radius: 12px; line-height: 1.5; white-space: pre-wrap; word-wrap: break-word; }
    .msg.user { align-self: flex-end; background: var(--user-bubble); color: #fff; border-bottom-right-radius: 2px; }
    .msg.assistant { align-self: flex-start; background: var(--ai-bubble); border: 1px solid var(--border); border-bottom-left-radius: 2px; }
    .msg .tag { font-size: 0.7rem; color: var(--muted); margin-bottom: 4px; display: block; }

    /* Input Bar */
    .input-bar { padding: 16px 24px; background: var(--panel); border-top: 1px solid var(--border); display: flex; gap: 12px; }
    .input-bar input { flex: 1; padding: 12px 16px; border-radius: 8px; border: 1px solid var(--border); background: var(--bg); color: var(--text); font-size: 0.9rem; }
    .input-bar input:focus { outline: none; border-color: var(--accent); }
    .input-bar button { padding: 0 24px; border-radius: 8px; border: none; background: var(--accent); color: #fff; font-weight: 600; cursor: pointer; }
    .input-bar button:hover { opacity: 0.9; }
    .input-bar button:disabled { opacity: 0.5; cursor: not-allowed; }
  </style>
</head>
<body>

  <header>
    <div class="header-left">
      <h1>AI Dataset Collector</h1>
      <span class="status-badge">● Auto-Logging Active</span>
    </div>

    <select id="modelSelect" title="Switch AI Model">
      <option value="gemini-3.8-flash">Gemini 3.8 Flash (Fast & Smart)</option>
      <option value="gemini-3.5-flash-lite">Gemini 3.5 Flash-Lite (Ultra Fast)</option>
      <option value="gemini-4-argon">Gemini 4 Argon (Deep Reasoning)</option>
      <option value="custom-gemma">My Fine-Tuned Gemma 2B (Colab)</option>
    </select>
  </header>

  <main class="chat-box" id="chatBox">
    <div class="msg assistant">
      <span class="tag">System</span>
      <span class="body">Ready! Pick any AI model at the top right and start chatting. Everything is logged to your spreadsheet automatically.</span>
    </div>
  </main>

  <form class="input-bar" id="chatForm">
    <input type="text" id="userInput" placeholder="Type your message here..." autocomplete="off" required autofocus />
    <button type="submit" id="sendBtn">Send</button>
  </form>

  <script>
    // 👇 1. PASTE YOUR APPS SCRIPT WEB APP URL HERE
    const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxDaZYcylrw4dps4kfQsosJSThOzRWOiN_07g57b6NddUofisi7Ul19whVwXu6wuM66/exec";

    // 👇 2. (OPTIONAL) PASTE YOUR COLAB TUNNEL URL HERE WHEN TESTING YOUR FINE-TUNED GEMMA
    const COLAB_GEMMA_URL = "";

    const modelSelect = document.getElementById("modelSelect");
    const chatBox = document.getElementById("chatBox");
    const chatForm = document.getElementById("chatForm");
    const userInput = document.getElementById("userInput");
    const sendBtn = document.getElementById("sendBtn");

    let conversation = [];

    function appendMessage(role, text, label) {
      const div = document.createElement("div");
      div.className = "msg " + role;

      const tagSpan = document.createElement("span");
      tagSpan.className = "tag";
      tagSpan.textContent = label;

      const bodySpan = document.createElement("span");
      bodySpan.className = "body";
      bodySpan.textContent = text;

      div.appendChild(tagSpan);
      div.appendChild(bodySpan);
      chatBox.appendChild(div);
      chatBox.scrollTop = chatBox.scrollHeight;
      return { tagSpan, bodySpan };
    }

    chatForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      const text = userInput.value.trim();
      if (!text) return;

      const selectedModel = modelSelect.value;
      const modelLabel = modelSelect.options[modelSelect.selectedIndex].text;

      userInput.value = "";
      sendBtn.disabled = true;
      appendMessage("user", text, "You");
      conversation.push({ role: "user", content: text });

      const loading = appendMessage("assistant", "Thinking...", modelLabel);

      try {
        const res = await fetch(APPS_SCRIPT_URL, {
          method: "POST",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify({
            model: selectedModel,
            colabUrl: COLAB_GEMMA_URL,
            messages: conversation
          })
        });

        if (!res.ok) throw new Error("Server returned HTTP " + res.status);
        const data = await res.json();
        if (data.error) throw new Error(data.error);

        const reply = data.choices[0].message.content;
        loading.bodySpan.textContent = reply;
        conversation.push({ role: "assistant", content: reply });
      } catch (err) {
        loading.tagSpan.textContent = "Error";
        loading.bodySpan.textContent = err.message;
        conversation.pop();
      } finally {
        sendBtn.disabled = false;
        userInput.focus();
      }
    });
  </script>
</body>
</html>
