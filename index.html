<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multi-Model AI Hub & Dataset Collector</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-gray-100 flex flex-col h-screen">
    <!-- Header -->
    <header class="bg-gray-800 border-b border-gray-700 p-4 flex flex-wrap justify-between items-center gap-3">
        <h1 class="text-xl font-bold flex items-center gap-2">🤖 AI Hub & Dataset Collector</h1>
        <div class="flex items-center gap-3 flex-wrap">
            <!-- Model Selector -->
            <select id="modelSelect" class="bg-gray-700 border border-gray-600 rounded px-3 py-1.5 text-sm focus:outline-none">
                <option value="custom-gemma">My Fine-Tuned Gemma 2B (Colab)</option>
                <option value="groq/llama-3.3-70b-versatile">Groq: Llama 3.3 70B</option>
                <option value="or/deepseek/deepseek-chat:free">OpenRouter: DeepSeek V3 (Free)</option>
            </select>

            <!-- Colab Tunnel URL Input -->
            <input id="colabUrlInput" type="text" placeholder="https://....trycloudflare.com" class="bg-gray-700 border border-gray-600 rounded px-2.5 py-1.5 text-xs w-52 focus:outline-none focus:border-blue-500" title="Paste Cloudflare URL here">

            <!-- Search Toggle (ON BY DEFAULT) -->
            <label class="flex items-center gap-2 text-sm cursor-pointer select-none bg-gray-700/60 px-2.5 py-1.5 rounded border border-gray-600">
                <input type="checkbox" id="searchToggle" checked class="rounded bg-gray-700 border-gray-600 text-blue-500 focus:ring-0">
                <span>Web Search</span>
            </label>

            <!-- Usage Counter -->
            <div id="usageCounter" class="text-xs bg-gray-700 px-2.5 py-1.5 rounded text-gray-300">
                Usage: 0/50 today
            </div>
        </div>
    </header>

    <!-- Chat Container -->
    <main id="chatContainer" class="flex-1 overflow-y-auto p-4 space-y-4 max-w-4xl w-full mx-auto">
        <div class="flex items-start gap-3">
            <div class="bg-blue-600 text-white rounded-full h-8 w-8 flex items-center justify-center font-bold shrink-0 text-xs">AI</div>
            <div class="bg-gray-800 border border-gray-700 p-3.5 rounded-2xl max-w-[80%] text-sm leading-relaxed">
                Ready! Web Search is ON by default. Type a message and watch it log directly to your Google Sheet!
            </div>
        </div>
    </main>

    <!-- Input Area -->
    <footer class="bg-gray-800 border-t border-gray-700 p-4">
        <div class="max-w-4xl mx-auto flex gap-3">
            <textarea id="userInput" rows="1" placeholder="Type your message here..." class="flex-1 bg-gray-700 border border-gray-600 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-blue-500 resize-none"></textarea>
            <button id="sendBtn" class="bg-blue-600 hover:bg-blue-500 text-white font-medium px-6 py-3 rounded-xl text-sm transition-colors shrink-0">Send</button>
        </div>
    </footer>

    <script>
        const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxDaZYcylrw4dps4kfQsosJSThOzRWOiN_07g57b6NddUofisi7Ul19whVwXu6wuM66/exec";
        const DEFAULT_COLAB_BASE = "https://chapter-filename-progress-four.trycloudflare.com";

        let messages = [];

        const colabInput = document.getElementById("colabUrlInput");
        colabInput.value = localStorage.getItem("saved_colab_url") || DEFAULT_COLAB_BASE;
        colabInput.addEventListener("change", () => {
            localStorage.setItem("saved_colab_url", colabInput.value.trim());
        });

        function getFullColabUrl() {
            let base = colabInput.value.trim().replace(/\/+$/, "");
            if (!base.endsWith("/v1/chat/completions")) {
                base += "/v1/chat/completions";
            }
            return base;
        }

        function checkAndIncrementUsage() {
            const today = new Date().toISOString().slice(0, 10);
            let usageData = JSON.parse(localStorage.getItem("ai_chat_usage") || "{}");
            if (usageData.date !== today) {
                usageData = { date: today, count: 0 };
            }
            if (usageData.count >= 50) {
                alert("Daily usage limit of 50 reached!");
                return false;
            }
            usageData.count++;
            localStorage.setItem("ai_usage", JSON.stringify(usageData));
            document.getElementById("usageCounter").innerText = `Usage: ${usageData.count}/50 today`;
            return true;
        }

        (function() {
            const today = new Date().toISOString().slice(0, 10);
            let usageData = JSON.parse(localStorage.getItem("ai_chat_usage") || "{}");
            if (usageData.date === today) {
                document.getElementById("usageCounter").innerText = `Usage: ${usageData.count}/50 today`;
            }
        })();

        async function handleSend() {
            const inputEl = document.getElementById("userInput");
            const text = inputEl.value.trim();
            if (!text) return;

            if (!checkAndIncrementUsage()) return;

            inputEl.value = "";
            appendMessage("user", text);
            messages.push({ role: "user", content: text });

            const selectedModel = document.getElementById("modelSelect").value;
            const useSearch = document.getElementById("searchToggle").checked;

            const loadingId = appendMessage("assistant", "Thinking...");

            try {
                const payload = {
                    model: selectedModel,
                    useSearch: useSearch,
                    messages: messages,
                    colabUrl: getFullColabUrl()
                };

                const targetUrl = APPS_SCRIPT_URL + "?data=" + encodeURIComponent(JSON.stringify(payload));
                const response = await fetch(targetUrl, { method: "GET" });
                const rawText = await response.text();
                removeMessage(loadingId);

                let data;
                try {
                    data = JSON.parse(rawText);
                } catch (parseErr) {
                    appendMessage("assistant", "⚠️ Non-JSON response from Apps Script:\n" + rawText.slice(0, 180));
                    return;
                }

                if (data.error) {
                    appendMessage("assistant", "⚠️ Error: " + data.error);
                } else if (data.choices && data.choices[0] && data.choices[0].message) {
                    const reply = data.choices[0].message.content;
                    appendMessage("assistant", reply);
                    messages.push({ role: "assistant", content: reply });
                } else {
                    appendMessage("assistant", "⚠️ Unexpected response format.");
                }
            } catch (err) {
                removeMessage(loadingId);
                appendMessage("assistant", "⚠️ Fetch failed: " + err.message);
            }
        }

        function appendMessage(role, text) {
            const container = document.getElementById("chatContainer");
            const msgId = "msg-" + Math.random().toString(36).substr(2, 9);
            const isUser = role === "user";

            const wrapper = document.createElement("div");
            wrapper.id = msgId;
            wrapper.className = `flex items-start gap-3 ${isUser ? "flex-row-reverse" : ""}`;

            const avatar = document.createElement("div");
            avatar.className = `${isUser ? "bg-emerald-600" : "bg-blue-600"} text-white rounded-full h-8 w-8 flex items-center justify-center font-bold text-xs shrink-0`;
            avatar.innerText = isUser ? "You" : "AI";

            const bubble = document.createElement("div");
            bubble.className = `${isUser ? "bg-blue-600 text-white" : "bg-gray-800 border border-gray-700 text-gray-100"} p-3.5 rounded-2xl max-w-[80%] text-sm leading-relaxed whitespace-pre-wrap`;
            bubble.innerText = text;

            wrapper.appendChild(avatar);
            wrapper.appendChild(bubble);
            container.appendChild(wrapper);
            container.scrollTop = container.scrollHeight;

            return msgId;
        }

        function removeMessage(id) {
            const el = document.getElementById(id);
            if (el) el.remove();
        }

        document.getElementById("sendBtn").addEventListener("click", handleSend);
        document.getElementById("userInput").addEventListener("keydown", (e) => {
            if (e.key === "Enter" && !e.shiftKey) {
                e.preventDefault();
                handleSend();
            }
        });
    </script>
</body>
</html>
